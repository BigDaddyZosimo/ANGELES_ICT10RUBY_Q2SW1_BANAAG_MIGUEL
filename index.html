<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Verification System</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net">
    <script type="module" src="https://pyscript.net"></script>
    <style>
        html, body {
            background-color: #f4f6f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        body.container.mt-5 {
            max-width: 400px;
            height: auto;
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #dee2e6;
            display: block;
        }
        body::before {
            content: "";
            display: block;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            background: url(archer.jpg) center/contain no-repeat;
        }
        .form-control {
            text-align: center;
            border: 1px solid #ced4da;
            padding: 10px;
        }
        .form-control:focus {
            border-color: #146c43;
            box-shadow: 0 0 0 0.25rem rgba(20, 108, 67, 0.15);
        }
        button.btn-success {
            width: 100%;
            background-color: #146c43 !important;
            border: none;
            color: white;
            font-weight: 600;
            padding: 11px;
        }
        button.btn-success:hover {
            background-color: #0f5132 !important;
        }
        #result_area {
            text-align: center;
            min-height: 24px;
        }
        h5.text-secondary {
            color: #146c43 !important;
            font-weight: bold;
            text-align: center;
            border-top: 1px solid #f1f1f1;
            padding-top: 15px;
            margin-top: 15px;
        }
        #output {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }
        .archer-badge {
            background: #146c43;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
        }
    </style>
</head>
<body class="container mt-5">

    <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">
    <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">
    
    <button type="button" class="btn btn-success mb-3" py-click="verify_candidate">add</button>
    
    <div id="result_area" class="mb-4 fw-bold"></div>

    <h5 class="text-secondary tracking-wider small text-uppercase mb-2">DLSU Roster</h5>
    <div id="output"></div>

    <script type="py" src="main.py"></script>
</body>
</html>
