<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Verification System</title>

    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net">
    <script type="module" src="https://pyscript.net"></script>

    <style>
        body {
            background-color: #f4f6f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #dee2e6;
        }

        h2 {
            color: #146c43;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-control {
            text-align: center;
            padding: 10px;
        }

        .btn-success {
            width: 100%;
            background-color: #146c43;
            border: none;
            padding: 11px;
        }

        .btn-success:hover {
            background-color: #0f5132;
        }

        #result_area {
            text-align: center;
            min-height: 24px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container-box">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="archer.jpg" alt="Archer JG Logo" style="max-width: 50%; height: auto; border-radius: 6px;">
        </div>
        
        <h2>Candidate Verification</h2>


        <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">

        <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">

        <button type="button" class="btn btn-success mb-3" py-click="verify_candidate">
            Verify Candidate
        </button>

        <p id="result_area" class="fw-bold"></p>
    </div>

    <script type="py" src="./main.py"></script>
</body>
</html>
